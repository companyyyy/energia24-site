name: Deploy to server

on:
  push:
    branches: [ main ]
  # Коміти бота з оновленими фідами (через GITHUB_TOKEN) не запускають push-подію,
  # тому викладаємо на сервер ще й після кожного оновлення фідів.
  workflow_run:
    workflows: [ "Update product feed" ]
    types: [ completed ]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/sites/energia24/html
            git pull
