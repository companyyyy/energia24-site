name: Update product feed

on:
  # Зміни товарів і цін з адмінки (/admin) або скриптів - фіди перебудовуються одразу.
  push:
    branches: [ main ]
    paths:
      - 'data/products/**'
      - 'data/feeds.json'
      - 'images/products/**'
      - 'images/pa/**'
      - 'scripts/**'
      # Каталог сайту (index.html) фідів Prom не стосується.
      - '!scripts/site_catalog.py'
  workflow_dispatch: {}

permissions:
  contents: write

# Не запускати два оновлення одночасно (кілька збережень поспіль в адмінці).
concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build feeds (feed.xml, pa.xml, feed/*.xml)
        run: python3 scripts/update_feed.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A feed.xml pa.xml feed data/feeds_built.json
          if git diff --cached --quiet; then
            echo "Змін немає"
          else
            git commit -m "Оновлення фідів з адмінки"
            # За час генерації в main могли з'явитися нові коміти з адмінки.
            git pull --rebase
            git push
          fi
