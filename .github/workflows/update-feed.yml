name: Update product feed from Google Sheet

on:
  schedule:
    # 3 рази на добу: ~06:00, 12:00, 18:00 за Києвом (зсув ±1г залежно від переходу на літній/зимовий час)
    - cron: '0 4,10,16 * * *'
  # Зміни товарів з адмінки (/admin) і скриптів - фіди перебудовуються одразу.
  push:
    branches: [ main ]
    paths:
      - 'data/products/**'
      - 'images/products/**'
      - 'images/pa/**'
      - 'scripts/**'
  workflow_dispatch: {}

permissions:
  contents: write

# Не запускати два оновлення одночасно (розклад + збереження в адмінці).
concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update feed.xml from Google Sheet
        run: python3 scripts/update_feed.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml pa.xml
          if git diff --cached --quiet; then
            echo "Змін немає"
          else
            git commit -m "Автооновлення feed.xml з Google Sheets"
            # За час генерації в main могли з'явитися нові коміти (напр., з адмінки).
            git pull --rebase
            git push
          fi
