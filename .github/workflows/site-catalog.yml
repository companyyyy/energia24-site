name: Update site catalog

on:
  # Ціни й наявність з фіду avtonomka - щогодини.
  schedule:
    - cron: '17 * * * *'
  # Збереження в адмінці сайту (/admin/site.html) - перебудувати сторінку одразу.
  push:
    branches: [ main ]
    paths:
      - 'data/site/**'
      - 'scripts/site_catalog.py'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: site-catalog
  cancel-in-progress: false

jobs:
  site-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync prices and build index.html, commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Поки скрипт працював, у main могли з'явитися коміти з адмінки -
          # тоді беремо свіжу версію і повторюємо.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/site_catalog.py sync build
            git add data/site/catalog.json index.html
            if git diff --cached --quiet; then
              echo "Змін немає"
              exit 0
            fi
            git commit -m "Оновлення каталогу сайту з фіду avtonomka"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          exit 1
