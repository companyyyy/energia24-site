<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Адмінка ENERGIA24</title>
  <!-- Головна сторінка адмінки: ціни й наявність усіх товарів для фідів feed.xml і pa.xml.
       Читає й комітить data/products/*.json через GitHub API тим самим токеном,
       що й повна адмінка товарів Sveltia CMS (/admin/cms/). Зміни - одним комітом,
       після нього GitHub Actions перебудовує фіди. -->
  <style>
    :root {
      --bg: #f6f7f9; --surface: #fff; --text: #1b1f24; --muted: #6b7280;
      --border: #e3e6ea; --accent: #2f6fde; --accent-text: #fff;
      --changed: #fff6d6; --error: #c62828; --ok: #2e7d32; --row-hover: #f1f4f8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181c; --surface: #1e2126; --text: #e6e8eb; --muted: #9aa1ab;
        --border: #30343b; --accent: #4a86f0; --accent-text: #fff;
        --changed: #3a3320; --error: #ef6b6b; --ok: #6cc070; --row-hover: #252930;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    header { position: sticky; top: 0; z-index: 2; background: var(--surface);
      border-bottom: 1px solid var(--border); padding: 12px 16px;
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    header h1 { font-size: 18px; margin: 0 8px 0 0; }
    header a { color: var(--accent); text-decoration: none; }
    .spacer { flex: 1; }
    input[type=search], input[type=password], input.price {
      font: inherit; color: var(--text); background: var(--bg);
      border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; }
    input[type=search] { width: 240px; max-width: 100%; }
    input.price { width: 110px; text-align: right; font-variant-numeric: tabular-nums; }
    input.price:focus, input[type=search]:focus, input[type=password]:focus {
      outline: 2px solid var(--accent); outline-offset: -1px; }
    input.price.invalid { outline: 2px solid var(--error); }
    input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
    button { font: inherit; border-radius: 6px; padding: 7px 14px; cursor: pointer;
      border: 1px solid var(--border); background: var(--surface); color: var(--text); }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    button:disabled { opacity: .5; cursor: default; }
    .cats { display: flex; gap: 4px; flex-wrap: wrap; }
    .cats button { padding: 5px 10px; font-size: 14px; }
    .cats button.active { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    main { padding: 16px; max-width: 1200px; margin: 0 auto; }
    .table-wrap { overflow-x: auto; background: var(--surface);
      border: 1px solid var(--border); border-radius: 8px; }
    table { border-collapse: collapse; width: 100%; min-width: 760px; }
    th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; }
    th { font-size: 13px; color: var(--muted); font-weight: 600; white-space: nowrap; }
    th.group { text-align: center; border-left: 1px solid var(--border); }
    td.sep, th.sep { border-left: 1px solid var(--border); }
    td.c, th.c { text-align: center; }
    tbody tr:hover { background: var(--row-hover); }
    tbody tr.changed { background: var(--changed); }
    tbody tr.disabled td.name { opacity: .5; }
    td.id { color: var(--muted); font-variant-numeric: tabular-nums; width: 40px; }
    td.img { width: 52px; }
    td.img img { width: 40px; height: 40px; object-fit: contain; background: #fff; border-radius: 4px; display: block; }
    td.name .cat { display: block; color: var(--muted); font-size: 13px; }
    td.name a { color: inherit; text-decoration: none; }
    td.name a:hover { text-decoration: underline; }
    .status { min-height: 20px; margin: 0 0 12px; }
    .status.error { color: var(--error); }
    .status.ok { color: var(--ok); }
    .login { max-width: 520px; margin: 40px auto; background: var(--surface);
      border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
    .login input { width: 100%; margin: 8px 0 12px; }
    .login p { color: var(--muted); margin: 0 0 8px; }
    .savebar { position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--border);
      padding: 10px 16px; display: flex; gap: 10px; align-items: center; justify-content: flex-end; }
    .savebar[hidden] { display: none; }
    [hidden] { display: none !important; }
    @media (max-width: 640px) {
      header { gap: 8px; }
      input[type=search] { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Товари і ціни</h1>
    <a href="cms/" title="Фото, описи, характеристики, нові товари">Редагувати товари →</a>
    <span class="spacer"></span>
    <div class="cats" id="cats"></div>
    <input type="search" id="search" placeholder="Пошук за назвою або ID" />
  </header>

  <main>
    <div class="login" id="login" hidden>
      <h2>Вхід</h2>
      <p>Вставте токен GitHub (або увійдіть у <a href="cms/">редактор товарів</a> через Sign In with Token і поверніться сюди):</p>
      <input type="password" id="token" placeholder="github_pat_…" autocomplete="off" />
      <button class="primary" id="login-btn">Увійти</button>
    </div>

    <p class="status" id="status"></p>

    <div class="table-wrap" id="table-wrap" hidden>
      <table>
        <thead>
          <tr>
            <th colspan="3"></th>
            <th class="group" colspan="2">Роздріб · feed.xml</th>
            <th class="group" colspan="3">PA · pa.xml</th>
          </tr>
          <tr>
            <th>ID</th><th></th><th>Товар</th>
            <th class="sep">Ціна, грн</th><th class="c">В наявності</th>
            <th class="sep c">У фіді</th><th>Ціна, грн</th><th class="c">В наявності</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>

  <div class="savebar" id="savebar" hidden>
    <span id="changed-count"></span>
    <button id="reset-btn">Скасувати</button>
    <button class="primary" id="save-btn">Зберегти</button>
  </div>

  <script>
  (() => {
    const REPO = "companyyyy/energia24-site";
    const BRANCH = "main";
    const DIR = "data/products";
    const API = "https://api.github.com";
    const OWN_TOKEN_KEY = "energia24-prices.token";
    const CATEGORIES = { 1: "Інвертори", 2: "Акумулятори", 3: "Системи 2 в 1", 4: "Зарядні станції" };

    const $ = (id) => document.getElementById(id);
    let token = null;
    // id -> { file, sha, data (як у репозиторії), edit (поточні значення в формі) }
    let products = new Map();
    let filterCat = 0;

    function storageGet(key) {
      try { return localStorage.getItem(key); } catch { return null; }
    }
    function storageSet(key, value) {
      try { value == null ? localStorage.removeItem(key) : localStorage.setItem(key, value); } catch {}
    }

    // Токен беремо з адмінки Sveltia CMS (той самий сайт), інакше - введений тут.
    function findToken() {
      try {
        const user = JSON.parse(storageGet("sveltia-cms.user") || "null");
        if (user && user.backendName === "github" && user.token) return user.token;
      } catch {}
      return storageGet(OWN_TOKEN_KEY);
    }

    function setStatus(text, kind = "") {
      const el = $("status");
      el.textContent = text;
      el.className = "status " + kind;
    }

    async function gh(path, options = {}) {
      const res = await fetch(API + path, {
        ...options,
        headers: {
          Accept: "application/vnd.github+json",
          Authorization: "Bearer " + token,
          "X-GitHub-Api-Version": "2022-11-28",
          ...(options.body ? { "Content-Type": "application/json" } : {}),
        },
      });
      if (!res.ok) {
        const err = new Error(`GitHub ${res.status}: ${(await res.text()).slice(0, 200)}`);
        err.status = res.status;
        throw err;
      }
      return res.json();
    }

    // UTF-8 base64 у обидва боки.
    const b64decode = (b64) => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g, "")), (c) => c.charCodeAt(0)));

    async function listFiles(ref) {
      const items = await gh(`/repos/${REPO}/contents/${DIR}?ref=${encodeURIComponent(ref)}`);
      return items.filter((i) => i.type === "file" && i.name.endsWith(".json"));
    }

    async function load() {
      setStatus("Завантаження…");
      $("table-wrap").hidden = true;
      const files = await listFiles(BRANCH);
      const loaded = await Promise.all(files.map(async (f) => {
        const blob = await gh(`/repos/${REPO}/git/blobs/${f.sha}`);
        return { file: f.path, sha: f.sha, data: JSON.parse(b64decode(blob.content)) };
      }));
      products = new Map();
      loaded
        .sort((a, b) => (a.data.category - b.data.category) || ((a.data.order || 0) - (b.data.order || 0)) || (a.data.id - b.data.id))
        .forEach((p) => products.set(p.data.id, { ...p, edit: pickEditable(p.data) }));
      render();
      $("table-wrap").hidden = false;
      setStatus("");
    }

    function pickEditable(d) {
      return {
        price: d.price ?? null,
        in_stock: d.in_stock ?? false,
        pa: d.pa ?? false,
        pa_price: d.pa_price ?? null,
        pa_in_stock: d.pa_in_stock ?? false,
      };
    }

    function isChanged(p) {
      const orig = pickEditable(p.data);
      return Object.keys(orig).some((k) => orig[k] !== p.edit[k]);
    }

    // "12 500" / "12500,00" -> 12500; порожньо -> null; помилка -> NaN
    function parsePrice(text) {
      const t = text.replace(/[\s ]/g, "").replace(",", ".");
      if (t === "") return null;
      if (!/^\d+(\.\d+)?$/.test(t)) return NaN;
      const n = Math.round(parseFloat(t));
      return n > 0 ? n : NaN;
    }

    function priceInput(p, field) {
      const input = document.createElement("input");
      input.className = "price";
      input.inputMode = "numeric";
      input.dataset.field = field;
      input.value = p.edit[field] ?? "";
      input.addEventListener("input", () => {
        const v = parsePrice(input.value);
        input.classList.toggle("invalid", Number.isNaN(v));
        p.edit[field] = Number.isNaN(v) ? NaN : v;
        refreshRow(p);
      });
      // Enter - до того самого поля в наступному рядку.
      input.addEventListener("keydown", (e) => {
        if (e.key !== "Enter") return;
        e.preventDefault();
        const all = [...document.querySelectorAll(`input.price[data-field="${field}"]`)];
        const next = all[all.indexOf(input) + (e.shiftKey ? -1 : 1)];
        if (next) { next.focus(); next.select(); }
      });
      return input;
    }

    function checkbox(p, field) {
      const input = document.createElement("input");
      input.type = "checkbox";
      input.checked = !!p.edit[field];
      input.addEventListener("change", () => {
        p.edit[field] = input.checked;
        refreshRow(p);
      });
      return input;
    }

    function td(className, ...children) {
      const cell = document.createElement("td");
      if (className) cell.className = className;
      children.forEach((c) => cell.append(c));
      return cell;
    }

    function render() {
      const tbody = $("rows");
      tbody.textContent = "";
      for (const p of products.values()) {
        const d = p.data;
        const tr = document.createElement("tr");
        p.row = tr;
        tr.dataset.cat = d.category;
        tr.dataset.search = `${d.id} ${d.name}`.toLowerCase();
        tr.classList.toggle("disabled", d.enabled === false);

        const img = document.createElement("img");
        img.alt = "";
        img.loading = "lazy";
        if (d.photo) img.src = "/" + d.photo.replace(/^\//, "");
        else img.hidden = true;

        const link = document.createElement("a");
        link.href = `cms/#/collections/products/entries/${d.id}`;
        link.textContent = d.name;
        link.title = "Відкрити товар: фото, опис, характеристики";
        const cat = document.createElement("span");
        cat.className = "cat";
        cat.textContent = (CATEGORIES[d.category] || "") + (d.enabled === false ? " · прихований" : "");

        const paPrice = priceInput(p, "pa_price");
        const paStock = checkbox(p, "pa_in_stock");
        p.paInputs = [paPrice, paStock];

        tr.append(
          td("id", String(d.id)),
          td("img", img),
          td("name", link, cat),
          td("sep", priceInput(p, "price")),
          td("c", checkbox(p, "in_stock")),
          td("sep c", checkbox(p, "pa")),
          td("", paPrice),
          td("c", paStock),
        );
        tbody.append(tr);
        refreshRow(p);
      }
      applyFilter();
    }

    function refreshRow(p) {
      p.row.classList.toggle("changed", isChanged(p));
      p.paInputs.forEach((el) => { el.disabled = !p.edit.pa; });
      const changed = [...products.values()].filter(isChanged);
      $("savebar").hidden = changed.length === 0;
      $("changed-count").textContent = `Змінено товарів: ${changed.length}`;
    }

    function renderCats() {
      const box = $("cats");
      const entries = [[0, "Усі"], ...Object.entries(CATEGORIES)];
      for (const [id, label] of entries) {
        const b = document.createElement("button");
        b.textContent = label;
        b.classList.toggle("active", Number(id) === filterCat);
        b.addEventListener("click", () => {
          filterCat = Number(id);
          [...box.children].forEach((c) => c.classList.toggle("active", c === b));
          applyFilter();
        });
        box.append(b);
      }
    }

    function applyFilter() {
      const q = $("search").value.trim().toLowerCase();
      for (const p of products.values()) {
        const r = p.row;
        r.hidden = (filterCat && Number(r.dataset.cat) !== filterCat) || (q && !r.dataset.search.includes(q));
      }
    }

    async function save() {
      const changed = [...products.values()].filter(isChanged);
      if (changed.some((p) => Number.isNaN(p.edit.price) || Number.isNaN(p.edit.pa_price))) {
        setStatus("Виправте ціни, підсвічені червоним: лише число більше нуля або порожньо.", "error");
        return;
      }
      $("save-btn").disabled = true;
      setStatus("Збереження…");
      try {
        await commit(changed);
        setStatus(`Збережено (${changed.length} товарів). Фіди оновляться на сайті приблизно за 1–2 хвилини.`, "ok");
        await load();
        setStatus(`Збережено (${changed.length} товарів). Фіди оновляться на сайті приблизно за 1–2 хвилини.`, "ok");
      } catch (e) {
        setStatus(e.message, "error");
      } finally {
        $("save-btn").disabled = false;
      }
    }

    // Один коміт на всі змінені товари. Якщо поки редагували, хтось змінив
    // ці ж файли - не перезаписуємо, просимо оновити сторінку.
    async function commit(changed, attempt = 1) {
      const ref = await gh(`/repos/${REPO}/git/ref/heads/${BRANCH}`);
      const head = ref.object.sha;
      const current = new Map((await listFiles(head)).map((f) => [f.path, f.sha]));
      const conflicts = changed.filter((p) => current.get(p.file) !== p.sha);
      if (conflicts.length) {
        throw new Error("Ці товари щойно змінив хтось інший: " +
          conflicts.map((p) => p.data.name).join(", ") + ". Оновіть сторінку і внесіть зміни ще раз.");
      }
      const headCommit = await gh(`/repos/${REPO}/git/commits/${head}`);
      const tree = await gh(`/repos/${REPO}/git/trees`, {
        method: "POST",
        body: JSON.stringify({
          base_tree: headCommit.tree.sha,
          tree: changed.map((p) => ({
            path: p.file,
            mode: "100644",
            type: "blob",
            content: JSON.stringify({ ...p.data, ...p.edit }, null, 2) + "\n",
          })),
        }),
      });
      const names = changed.map((p) => p.data.id).join(", ");
      const newCommit = await gh(`/repos/${REPO}/git/commits`, {
        method: "POST",
        body: JSON.stringify({
          message: `Адмінка: ціни (товари ${names})`,
          tree: tree.sha,
          parents: [head],
        }),
      });
      try {
        await gh(`/repos/${REPO}/git/refs/heads/${BRANCH}`, {
          method: "PATCH",
          body: JSON.stringify({ sha: newCommit.sha, force: false }),
        });
      } catch (e) {
        // main встиг посунутися (напр., коміт бота з фідами) - пробуємо ще раз від нової вершини.
        if (e.status === 422 && attempt < 3) return commit(changed, attempt + 1);
        throw e;
      }
    }

    async function start() {
      token = findToken();
      if (!token) {
        $("login").hidden = false;
        return;
      }
      try {
        await load();
      } catch (e) {
        if (e.status === 401 || e.status === 403 || e.status === 404) {
          storageSet(OWN_TOKEN_KEY, null);
          $("login").hidden = false;
          setStatus("Токен не підходить або не має доступу до репозиторію. Увійдіть ще раз.", "error");
        } else {
          setStatus(e.message, "error");
        }
      }
    }

    $("login-btn").addEventListener("click", () => {
      const t = $("token").value.trim();
      if (!t) return;
      storageSet(OWN_TOKEN_KEY, t);
      $("login").hidden = true;
      setStatus("");
      start();
    });
    $("search").addEventListener("input", applyFilter);
    $("save-btn").addEventListener("click", save);
    $("reset-btn").addEventListener("click", () => { for (const p of products.values()) p.edit = pickEditable(p.data); render(); });
    window.addEventListener("beforeunload", (e) => {
      if ([...products.values()].some(isChanged)) e.preventDefault();
    });

    renderCats();
    start();
  })();
  </script>
</body>
</html>
