# Адмінка товарів для XML-фідів Prom.ua (feed.xml, pa.xml).
# Кожне збереження - коміт у GitHub; після нього GitHub Actions
# перебудовує фіди (.github/workflows/update-feed.yml) і викладає на сервер.
# Ціни й наявність тут не редагуються - вони беруться з Google-таблиць.

backend:
  name: github
  repo: companyyyy/energia24-site
  branch: main
  commit_messages:
    create: "Адмінка: додати товар {{slug}}"
    update: "Адмінка: оновити товар {{slug}}"
    delete: "Адмінка: видалити товар {{slug}}"
    uploadMedia: "Адмінка: завантажити фото {{path}}"
    deleteMedia: "Адмінка: видалити фото {{path}}"

site_url: https://energia24.com.ua
display_url: https://energia24.com.ua

media_folder: images/products
public_folder: /images/products

collections:
  - name: products
    label: Товари
    label_singular: Товар
    description: >-
      Товари для фідів Prom.ua. Ціна й наявність підтягуються з Google-таблиць
      за полем «Ключ для прайсу». Фіди оновлюються приблизно через 1–2 хвилини після збереження.
    folder: data/products
    format: json
    extension: json
    create: true
    delete: true
    slug: "{{fields.id}}"
    identifier_field: name
    summary: "{{id}} · {{name}}"
    sortable_fields: [id, name, category, order]
    view_filters:
      - { label: Інвертори, field: category, eq: 1 }
      - { label: Акумулятори, field: category, eq: 2 }
      - { label: "Системи 2 в 1", field: category, eq: 3 }
      - { label: Зарядні станції, field: category, eq: 4 }
      - { label: Приховані, field: enabled, pattern: false }
    fields:
      - name: id
        label: ID товару
        widget: number
        value_type: int
        hint: >-
          Унікальне число. Для нового товару - наступне вільне (найбільший ID + 1).
          У наявних товарів НЕ змінювати: за ID Prom.ua пов'язує товар.
      - name: enabled
        label: Показувати у фідах
        widget: boolean
        default: true
        hint: Вимкніть, щоб прибрати товар з усіх фідів, не видаляючи його.
      - name: category
        label: Категорія
        widget: select
        options:
          - { label: Інвертори, value: 1 }
          - { label: Акумулятори, value: 2 }
          - { label: "Системи зберігання енергії 2 в 1", value: 3 }
          - { label: Зарядні станції, value: 4 }
      - name: order
        label: Порядок у категорії
        widget: number
        value_type: int
        default: 1000
        hint: Менше число - вище у фіді в межах категорії.
      - name: vendor
        label: Виробник
        widget: string
        hint: "Як на Prom: Must, Felicity, Deye, EcoFlow…"
      - name: name
        label: Назва (українською)
        widget: string
        hint: "Напр.: Акумулятор Felicity FLA48460TG2-EU. Російська назва для Prom будується автоматично."
      - name: key
        label: Ключ для прайсу
        widget: string
        hint: >-
          Унікальний шматок назви товару з колонки «Найменування» в Google-таблицях,
          напр. FLA48314 або PV19-6048. Має знаходитися рівно в одному рядку кожної таблиці,
          інакше ціни не буде. Увага на пробіли: у таблиці може бути «FLA 48460».
      - name: photo
        label: Фото
        widget: image
        required: false
        hint: Тільки на білому фоні (вимога Prom). Бажано JPG, квадратне, від 800 px.
      - name: summary
        label: Короткий опис
        widget: text
        hint: >-
          Перше речення - назва товару. Якщо нижче заповнені характеристики, у фід іде лише
          перше речення (+ «Функція: вбудований підігрів», якщо є), решта - з характеристик.
      - name: specs_source
        label: Джерело характеристик
        widget: string
        required: false
        hint: Файл даташиту або сайт, звідки взято дані (для довідки, у фід не йде).
      - name: specs
        label: Технічні характеристики
        label_singular: характеристику
        widget: list
        required: false
        summary: "{{fields.label}}: {{fields.value}}"
        fields:
          - { name: label, label: Назва, widget: string, hint: "Напр.: Номінальна енергія" }
          - { name: value, label: Значення, widget: string, hint: "Напр.: 16 кВт·год" }
          - name: label_ru
            label: Назва RU (необов'язково)
            widget: string
            required: false
            hint: Потрібно лише для нової назви, якої ще немає в словнику перекладів.
          - name: value_ru
            label: Значення RU (необов'язково)
            widget: string
            required: false
            hint: Якщо порожньо - перекладається автоматично.
      - name: name_ru
        label: Назва RU (необов'язково)
        widget: string
        required: false
        hint: Заповнюйте, лише якщо автоматичний переклад назви неправильний.
